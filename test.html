<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Download Document · FutureCrime Summit 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-base: #f8fafc;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --border-light: rgba(0, 0, 0, 0.1);
  --accent-cyan: #0ea5e9;
  --accent-purple: #5135FF;
  --accent-magenta: #FF5455;
  --grad-brand: linear-gradient(93deg, var(--accent-purple) 10.65%, var(--accent-magenta) 89.35%);
  --sans: 'Outfit', system-ui, -apple-system, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background-color: #a2c2e8; 
  color: var(--text-main);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}

/* Background matching the agenda */
.ambient-bg {
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background-color: #7db9e8;
  background-image:
    radial-gradient(circle at 10% 95%, #0d47a1 0%, transparent 50%),
    radial-gradient(circle at 90% 90%, #64b5f6 0%, transparent 60%),
    radial-gradient(circle at 0% 0%, #ffffff 0%, transparent 60%),
    radial-gradient(circle at 90% 10%, #e3f2fd 0%, transparent 60%);
}

.form-container {
  background: #ffffff;
  width: 100%;
  max-width: 680px;
  border-radius: 32px;
  box-shadow: 
    0 40px 100px -20px rgba(0, 50, 150, 0.25),
    0 1px 3px rgba(0, 0, 0, 0.05),
    inset 0 1px 1px rgba(255, 255, 255, 0.8);
  overflow: hidden;
  position: relative;
  z-index: 1;
}

/* Top Branding Area */
.branding {
  padding: 32px 40px 20px;
  background: #ffffff;
}

.logo-space {
  display: block;
  max-width: 200px;
  height: auto;
  margin-bottom: 24px;
}

/* Fallback if real logo image is broken */
.logo-placeholder {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 4px;
}
.logo-placeholder .red { color: var(--accent-magenta); }

.banner-space {
  width: 100%;
  height: auto;
  border-radius: 16px;
  display: block;
  object-fit: cover;
  background: #f1f5f9;
}

.form-body {
  padding: 32px 40px 48px;
}

.form-title {
  margin: 0 0 8px 0;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.form-desc {
  margin: 0 0 32px 0;
  color: var(--text-muted);
  font-size: 15px;
}

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
@media (max-width: 600px) {
  .grid-2 { grid-template-columns: 1fr; }
}

.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 20px;
}

.field label {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
}
.field label span { color: var(--accent-magenta); margin-left: 2px; }

.field input {
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid var(--border-light);
  background: #f8fafc;
  font-family: var(--sans);
  font-size: 15px;
  color: var(--text-main);
  transition: all .2s;
  width: 100%;
}
.field input:focus {
  outline: none;
  border-color: var(--accent-cyan);
  background: #ffffff;
  box-shadow: 0 0 0 3px var(--accent-cyan-dim);
}
.field input::placeholder { color: #94a3b8; }

.btn-submit {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border-radius: 14px;
  border: none;
  background: var(--grad-brand);
  color: #ffffff;
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
  box-shadow: 0 10px 20px -10px var(--accent-purple);
}

.btn-submit:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 15px 25px -10px var(--accent-purple);
}

.btn-submit:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
  filter: grayscale(100%);
}

.btn-submit svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Success State */
.success-msg {
  display: none;
  text-align: center;
  padding: 40px 20px;
}
.success-msg.active { display: block; }
.form-content.hidden { display: none; }

.success-icon {
  width: 64px; height: 64px;
  background: rgba(16, 172, 132, 0.1);
  color: #10AC84;
  border-radius: 50%;
  display: inline-grid; place-items: center;
  margin-bottom: 20px;
}
.success-icon svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

<div class="ambient-bg" aria-hidden="true"></div>

<main class="form-container">
  
  <!-- Branding Header -->
  <div class="branding">
    <!-- Real logo image fallback -->
    <img src="agenda/assets/summit.png" alt="FutureCrime Summit" class="logo-space" onerror="this.outerHTML='<div class=\'logo-placeholder\'>FUTURE<span class=\'red\'>CRIME</span></div>'">
    
    <!-- Banner Image provided by user -->
    <img src="agenda/assets/1600x520.webp" alt="Summit Venue Banner" class="banner-space" onerror="this.src='https://placehold.co/1200x400/f1f5f9/64748b?text=Venue+Banner+Image'">
  </div>

  <div class="form-body">
    
    <div class="form-content" id="form-content">
      <h1 class="form-title">Download Resources</h1>
      <p class="form-desc">Please provide your details below to securely access the summit documentation.</p>

      <form id="download-form">
        <div class="grid-2">
          <div class="field">
            <label for="name">Full Name <span>*</span></label>
            <input type="text" id="name" required placeholder="e.g. Aman Bandvi">
          </div>
          <div class="field">
            <label for="email">Mail ID <span>*</span></label>
            <input type="email" id="email" required placeholder="name@organization.com">
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="mobile">Mobile Number <span>*</span></label>
            <input type="tel" id="mobile" required placeholder="+91 98765 43210">
          </div>
          <div class="field">
            <label for="city">City <span>*</span></label>
            <input type="text" id="city" required placeholder="e.g. New Delhi">
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="org">Organisation <span>*</span></label>
            <input type="text" id="org" required placeholder="Company or Agency Name">
          </div>
          <div class="field">
            <label for="designation">Designation <span>*</span></label>
            <input type="text" id="designation" required placeholder="Your Job Title">
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn" disabled>
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Unlock & Download
        </button>
      </form>
    </div>

    <div class="success-msg" id="success-msg">
      <div class="success-icon">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <h2 class="form-title">Download Started!</h2>
      <p class="form-desc">Your document is being downloaded securely. Thank you for your interest in the FutureCrime Summit.</p>
      <button type="button" class="btn-submit" style="background:var(--bg-base); color:var(--text-main); box-shadow:none; border:1px solid var(--border-light);" onclick="location.reload()">
        Return
      </button>
    </div>

  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('download-form');
  const btn = document.getElementById('submit-btn');
  const inputs = form.querySelectorAll('input[required]');

  // Function to check if all mandatory fields have values
  const checkValidity = () => {
    let isValid = true;
    inputs.forEach(input => {
      if (!input.value.trim()) {
        isValid = false;
      }
    });
    btn.disabled = !isValid;
  };

  // Listen to input changes on all fields
  inputs.forEach(input => {
    input.addEventListener('input', checkValidity);
    input.addEventListener('change', checkValidity);
  });

  // Handle form submission
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    
    // 1. Swap UI to success message
    document.getElementById('form-content').classList.add('hidden');
    document.getElementById('success-msg').classList.add('active');

    // 2. Trigger a fake download for demonstration purposes
    // In a real scenario, this would point to the actual PDF/DOC URL
    const fakeLink = document.createElement('a');
    fakeLink.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent('Mock Document Content for FutureCrime Summit 2026.');
    fakeLink.download = 'FutureCrime_Summit_2026_Agenda.txt';
    document.body.appendChild(fakeLink);
    fakeLink.click();
    document.body.removeChild(fakeLink);
  });
});
</script>

</body>
</html>
